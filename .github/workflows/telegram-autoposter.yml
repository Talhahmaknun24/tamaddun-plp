name: Tamaddun Hub Telegram Auto-poster

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check feed and post new items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 telegram-bot/bot_post.py
      - name: Save posted state
        run: |
          git config user.name "tamaddun-hub-bot"
          git config user.email "bot@tamaddunhub.local"
          git add telegram-bot/state.json
          git diff --cached --quiet || git commit -m "Update posted state [skip ci]"
          git push
